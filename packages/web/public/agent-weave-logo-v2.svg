<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">AgentWeave logo</title>
  <desc id="desc">Two purple threads weaving into an abstract letter A.</desc>
  <defs>
    <linearGradient id="panel" x1="80" y1="48" x2="432" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f6fb"/>
    </linearGradient>
    <linearGradient id="thread" x1="112" y1="352" x2="400" y2="152" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7657d6"/>
      <stop offset="0.52" stop-color="#8b6ee8"/>
      <stop offset="1" stop-color="#a58cf2"/>
    </linearGradient>
    <linearGradient id="threadSoft" x1="112" y1="224" x2="400" y2="304" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b9a9f5"/>
      <stop offset="0.5" stop-color="#9275e8"/>
      <stop offset="1" stop-color="#6f51cf"/>
    </linearGradient>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#241b3d" flood-opacity="0.16"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#241b3d" flood-opacity="0.10"/>
    </filter>
    <filter id="markShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#6043bd" flood-opacity="0.18"/>
    </filter>
    <mask id="crossing">
      <rect width="512" height="512" fill="white"/>
      <path d="M110 272C154 222 191 218 226 258C261 298 301 302 402 230" fill="none" stroke="black" stroke-width="52" stroke-linecap="round"/>
      <path d="M110 272C154 222 191 218 226 258C261 298 301 302 402 230" fill="none" stroke="white" stroke-width="40" stroke-linecap="round"/>
    </mask>
  </defs>

  <rect x="36" y="28" width="440" height="440" rx="104" fill="url(#panel)" stroke="#ffffff" stroke-width="4" filter="url(#panelShadow)"/>

  <g filter="url(#markShadow)">
    <path d="M104 350C154 350 160 162 230 162C300 162 308 350 408 350" fill="none" stroke="url(#thread)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" mask="url(#crossing)"/>
    <path d="M110 272C154 222 191 218 226 258C261 298 301 302 402 230" fill="none" stroke="url(#threadSoft)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="104" cy="350" r="23" fill="#7657d6"/>
    <circle cx="408" cy="350" r="23" fill="#8f73e8"/>
    <circle cx="110" cy="272" r="19" fill="#b9a9f5"/>
    <circle cx="402" cy="230" r="19" fill="#6f51cf"/>
  </g>
</svg>
